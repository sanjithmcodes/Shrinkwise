<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Shrinkwise</title>
        <script>
            // Follow the OS light/dark setting (Bootstrap 5.3 reads data-bs-theme)
            (function () {
                var query = window.matchMedia('(prefers-color-scheme: dark)')
                function apply() {
                    document.documentElement.setAttribute('data-bs-theme', query.matches ? 'dark' : 'light')
                }
                apply()
                query.addEventListener('change', apply)
            })()
        </script>
        <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/imgs/favicon-32x32.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gabarito:wght@600;700;800&display=swap"
        rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
